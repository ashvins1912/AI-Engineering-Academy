name: terraform-static-validation
on:
  pull_request:
    paths:
      - "examples/stage-09/iac/**"
  push:
    branches: [main]
    paths:
      - "examples/stage-09/iac/**"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        working-directory: examples/stage-09/iac/aws-inference
        run: terraform fmt -check -recursive
      - name: Initialize providers without backend
        working-directory: examples/stage-09/iac/aws-inference
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        working-directory: examples/stage-09/iac/aws-inference
        run: terraform validate
      - name: Static infrastructure security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: examples/stage-09/iac/aws-inference
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
