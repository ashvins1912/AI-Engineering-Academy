apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-api-restricted
  namespace: ai-serving
spec:
  podSelector:
    matchLabels:
      app: inference-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              purpose: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              purpose: model-storage
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              purpose: telemetry
      ports:
        - protocol: TCP
          port: 4317
