services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: postgres-admin-local-only
    ports: ["5432:5432"]
    volumes:
      - academy-postgres:/var/lib/postgresql/data
      - ./migrations/000_local_role.sql:/docker-entrypoint-initdb.d/000_local_role.sql:ro
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./migrations/002_document_acl_ingestion_jobs.sql:/docker-entrypoint-initdb.d/002_document_acl_ingestion_jobs.sql:ro
      - ./migrations/003_raw_object_retention.sql:/docker-entrypoint-initdb.d/003_raw_object_retention.sql:ro
      - ./migrations/004_distributed_rate_limits.sql:/docker-entrypoint-initdb.d/004_distributed_rate_limits.sql:ro
      - ./migrations/005_code_runs.sql:/docker-entrypoint-initdb.d/005_code_runs.sql:ro
      - ./migrations/006_code_run_reconciliation.sql:/docker-entrypoint-initdb.d/006_code_run_reconciliation.sql:ro
      - ./migrations/007_code_run_dispatch_claim.sql:/docker-entrypoint-initdb.d/007_code_run_dispatch_claim.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d academy"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy_app:academy-app-local-only@postgres:5432/academy
      ACADEMY_JWT_PUBLIC_KEY: ${ACADEMY_JWT_PUBLIC_KEY:?Set a trusted JWT public key}
      ACADEMY_JWT_ISSUER: ${ACADEMY_JWT_ISSUER:?Set trusted JWT issuer}
      ACADEMY_JWT_AUDIENCE: ai-engineering-academy
      ACADEMY_OCR_ENABLED: "true"
      ACADEMY_EMBEDDING_DEVICE: cpu
      ACADEMY_STORAGE_BACKEND: local
      ACADEMY_STORAGE_ROOT: /app/var/private-uploads
      ACADEMY_MALWARE_SCAN_REQUIRED: "false"
    ports: ["8000:8000"]
    volumes: ["academy-private-uploads:/app/var/private-uploads"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    profiles: ["worker"]
    command: ["python", "-m", "app.worker", "--tenant-id", "${ACADEMY_WORKER_TENANT_ID:-00000000-0000-0000-0000-000000000000}"]
    environment:
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy_app:academy-app-local-only@postgres:5432/academy
      ACADEMY_EMBEDDING_DEVICE: cpu
      ACADEMY_STORAGE_BACKEND: local
      ACADEMY_STORAGE_ROOT: /app/var/private-uploads
      ACADEMY_INGESTION_JOB_LEASE_SECONDS: "900"
      ACADEMY_MALWARE_SCAN_REQUIRED: "false"
    volumes: ["academy-private-uploads:/app/var/private-uploads"]
    depends_on:
      postgres:
        condition: service_healthy
  code-run-reconciler:
    build: .
    profiles: ["code-run-reconciler"]
    command: ["python", "-m", "app.code_run_reconciler", "--tenant-id", "${ACADEMY_WORKER_TENANT_ID:?Set a trusted worker tenant ID}"]
    environment:
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy_app:academy-app-local-only@postgres:5432/academy
      ACADEMY_WORKER_TENANT_ID: ${ACADEMY_WORKER_TENANT_ID:?Set a trusted worker tenant ID}
      ACADEMY_CODE_EXECUTION_ENABLED: ${ACADEMY_CODE_EXECUTION_ENABLED:-false}
      ACADEMY_CODE_RUNNER_URL: ${ACADEMY_CODE_RUNNER_URL:-}
      ACADEMY_CODE_RUNNER_TOKEN: ${ACADEMY_CODE_RUNNER_TOKEN:-}
      ACADEMY_CODE_RUN_RECONCILE_LEASE_SECONDS: "60"
      ACADEMY_CODE_RUN_DISPATCH_LEASE_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
  cleanup:
    build: .
    profiles: ["cleanup"]
    command: ["python", "-m", "app.cleanup", "--tenant-id", "${ACADEMY_WORKER_TENANT_ID:-00000000-0000-0000-0000-000000000000}"]
    environment:
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy_app:academy-app-local-only@postgres:5432/academy
      ACADEMY_STORAGE_BACKEND: local
      ACADEMY_STORAGE_ROOT: /app/var/private-uploads
      ACADEMY_INGESTION_RAW_OBJECT_RETENTION_DAYS: "30"
      ACADEMY_INGESTION_CLEANUP_BATCH_SIZE: "100"
      ACADEMY_INGESTION_CLEANUP_LEASE_SECONDS: "300"
    volumes: ["academy-private-uploads:/app/var/private-uploads"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  academy-postgres:
  academy-private-uploads:
