name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: academy
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: postgres-admin-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_admin -d academy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ACADEMY_TEST_DATABASE_URL: postgresql+asyncpg://academy_app:academy-app-local-only@127.0.0.1:5432/academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:curriculum
      - run: npm run validate:topic-contract
      - run: npm run audit:topic-migration
      - run: npm run validate:stage1
      - run: npm run validate:stage2
      - run: npm run validate:stage3
      - run: npm run validate:stage4
      - run: npm run validate:stage5
      - run: npm run validate:phase3
      - run: npm run validate:phase4
      - run: npm run validate:phase5
      - run: npm run validate:phase6
      - run: npm run validate:documents
      - run: npm run validate:production-rag
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q backend/app backend/tests examples/stage-01 examples/stage-02 examples/stage-03 examples/stage-04 examples/stage-05 examples/stage-06 examples/stage-07 content/examples
      - run: python -m unittest discover -s examples/stage-01 -p 'test_*.py' -v
      - run: python -m unittest discover -s examples/stage-02 -p 'test_*.py' -v
      - run: python -m unittest discover -s examples/stage-03 -p 'test_*.py' -v
      - run: python -m unittest discover -s examples/stage-04 -p 'test_*.py' -v
      - run: python -m unittest discover -s examples/stage-05 -p 'test_*.py' -v
      - run: python -m unittest discover -s examples/stage-06 -p 'test_*.py' -v
      - run: python -m unittest discover -s examples/stage-07 -p 'test_*.py' -v
      - run: python -m unittest discover -s content/examples/tests -v
      - run: python -m pip install pytest fastapi==0.115.12 python-multipart==0.0.20 starlette==0.46.2 httpx==0.28.1 pydantic-settings==2.9.1 "PyJWT[crypto]" "SQLAlchemy[asyncio]==2.0.41" asyncpg==0.30.0 pgvector==0.4.1 pypdf==5.6.1 python-docx==1.1.2 pytesseract==0.3.13 pdf2image==1.17.0 Pillow==11.2.1
      - name: Apply isolated test database migrations
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  "postgresql://postgres_admin:postgres-admin-local-only@127.0.0.1:5432/academy"
              )
              try:
                  for path in sorted(Path("backend/migrations").glob("00[0-4]_*.sql")):
                      await conn.execute(path.read_text())
                      print(f"Applied {path}")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
      - name: Run backend tests including real PostgreSQL RLS integration
        run: cd backend && python -m pytest tests -q
