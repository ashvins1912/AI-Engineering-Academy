name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:curriculum
      - run: npm run validate:topic-contract
      - run: npm run validate:phase3
      - run: npm run validate:phase4
      - run: npm run validate:phase5
      - run: npm run validate:phase6
      - run: npm run validate:documents
      - run: npm run validate:production-rag
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m pip install pytest fastapi==0.115.12 starlette==0.46.2 httpx==0.28.1 pydantic-settings==2.9.1 "PyJWT[crypto]" "SQLAlchemy[asyncio]==2.0.41" asyncpg==0.30.0 pgvector==0.4.1 pypdf==5.6.1 python-docx==1.1.2 pytesseract==0.3.13 pdf2image==1.17.0 Pillow==11.2.1
      - run: python -m unittest discover -s content/examples/tests -v
      - run: cd backend && python -m pytest tests -q
